trigger:
  - main

pr:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.12'

steps:

# 1. Checkout source code
- checkout: self

# 2. Install Python
- task: UsePythonVersion@0
  displayName: 'Set up Python'
  inputs:
    versionSpec: '$(pythonVersion)'

# 3. Install dependencies
- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    pip install pytest flake8 bandit
  displayName: 'Install dependencies'

# 4. Lint
- script: |
    python -m pytest
  displayName: 'Run tests'
  env:
    PYTHONPATH: $(System.DefaultWorkingDirectory)

# 5. Run tests
- script: |
    pytest
  displayName: 'Run tests'

# 6. Security scan - Bandit
- script: |
    bandit -r app
  displayName: 'Run Bandit security scan'

# 7. Build Docker image
- script: |
    docker build -t melior:$(Build.BuildId) .
  displayName: 'Build Docker image'

# 8. Scan Docker image with Trivy
- script: |
    docker run --rm \
      -v /var/run/docker.sock:/var/run/docker.sock \
      aquasec/trivy:latest \
      image --severity HIGH,CRITICAL --exit-code 1 melior:$(Build.BuildId)
  displayName: 'Run Trivy container scan'